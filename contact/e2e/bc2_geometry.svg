<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 639" width="600" height="639" role="img" aria-label="Меридиональное сечение осесимметричной сборки BC1: ударник из полиуретана, две пластины карбида бора и окно из фторида лития">
<style>
svg { --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e;
      --axis:#b9b8b2; --dim:#8a8984;
      --m-pu:#eb6834; --m-b4c:#2a78d6; --m-lif:#1baf7a;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
@media (prefers-color-scheme: dark) {
  svg { --surface-1:#1a1a19; --text-primary:#ffffff; --text-secondary:#c3c2b7;
        --axis:#5a5955; --dim:#6f6e69;
        --m-pu:#d95926; --m-b4c:#3987e5; --m-lif:#199e70; }
}
.ttl { fill:var(--text-primary); font-size:15px; font-weight:600; }
.sub { fill:var(--text-secondary); font-size:11.5px; }
.lb  { fill:#ffffff; font-size:14px; font-weight:700; }
.dm  { fill:var(--dim); font-size:10px; }
.ax  { fill:var(--text-secondary); font-size:10.5px; }
.lg  { fill:var(--text-primary); font-size:11px; }
.vl  { font-size:11px; font-weight:600; }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/></marker></defs>
<rect width="600" height="639" fill="var(--surface-1)"/>
<text class="ttl" x="78" y="26">Геометрия кейса BC1 — меридиональное сечение</text>
<text class="sub" x="78" y="44">Осесимметричная постановка, показана половина r &gt; 0.</text>
<text class="sub" x="78" y="60">Масштаб по обеим осям одинаковый; размеры в мм.</text>
<rect x="78.0" y="104.0" width="54.0" height="393.8" fill="var(--m-pu)" fill-opacity="0.82" stroke="var(--m-pu)" stroke-width="1.5"/>
<text class="lb" x="105.0" y="305.9" text-anchor="middle">1</text>
<text class="dm" x="105.0" y="513.8" text-anchor="middle">6</text>
<line x1="87.0" y1="90.0" x2="123.0" y2="90.0" stroke="var(--m-pu)" stroke-width="2" marker-end="url(#ar)"/>
<text class="vl" x="105.0" y="83.0" text-anchor="middle" fill="var(--m-pu)">2210 м/с</text>
<rect x="133.8" y="186.3" width="33.5" height="311.4" fill="var(--m-b4c)" fill-opacity="0.82" stroke="var(--m-b4c)" stroke-width="1.5"/>
<text class="lb" x="150.5" y="347.0" text-anchor="middle">2</text>
<text class="dm" x="150.5" y="513.8" text-anchor="middle">3,717</text>
<line x1="132.5" y1="172.3" x2="168.5" y2="172.3" stroke="var(--m-b4c)" stroke-width="2" marker-end="url(#ar)"/>
<text class="vl" x="150.5" y="165.3" text-anchor="middle" fill="var(--m-b4c)">2210 м/с</text>
<rect x="174.5" y="186.3" width="81.3" height="311.4" fill="var(--m-b4c)" fill-opacity="0.82" stroke="var(--m-b4c)" stroke-width="1.5"/>
<text class="lb" x="215.1" y="347.0" text-anchor="middle">3</text>
<text class="dm" x="215.1" y="513.8" text-anchor="middle">9,033</text>
<rect x="257.5" y="269.1" width="226.8" height="228.6" fill="var(--m-lif)" fill-opacity="0.82" stroke="var(--m-lif)" stroke-width="1.5"/>
<text class="lb" x="370.9" y="388.4" text-anchor="middle">4</text>
<text class="dm" x="370.9" y="513.8" text-anchor="middle">25,2</text>
<line x1="58" y1="497.8" x2="504.3" y2="497.8" stroke="var(--axis)" stroke-width="1.2" stroke-dasharray="10 4 2 4"/>
<text class="ax" x="54" y="501.8" text-anchor="end">r = 0</text>
<text class="ax" x="508.3" y="501.8">z</text>
<text class="ax" x="26" y="300.9" text-anchor="middle" transform="rotate(-90 26 300.9)">r, мм</text>
<line x1="70" y1="407.8" x2="76" y2="407.8" stroke="var(--dim)" stroke-width="1"/>
<text class="dm" x="66" y="411.1" text-anchor="end">10</text>
<line x1="70" y1="317.8" x2="76" y2="317.8" stroke="var(--dim)" stroke-width="1"/>
<text class="dm" x="66" y="321.1" text-anchor="end">20</text>
<line x1="70" y1="227.8" x2="76" y2="227.8" stroke="var(--dim)" stroke-width="1"/>
<text class="dm" x="66" y="231.2" text-anchor="end">30</text>
<line x1="70" y1="104.0" x2="76" y2="104.0" stroke="var(--dim)" stroke-width="1"/>
<text class="dm" x="66" y="107.4" text-anchor="end">43,75</text>
<line x1="488.3" y1="104.0" x2="498.3" y2="104.0" stroke="var(--dim)" stroke-width="1"/>
<text class="dm" x="502.3" y="107.4">R = 43,75 (тело 1)</text>
<line x1="488.3" y1="186.3" x2="498.3" y2="186.3" stroke="var(--dim)" stroke-width="1"/>
<text class="dm" x="502.3" y="189.7">R = 34,6 (тела 2, 3)</text>
<line x1="488.3" y1="269.1" x2="498.3" y2="269.1" stroke="var(--dim)" stroke-width="1"/>
<text class="dm" x="502.3" y="272.5">R = 25,4 (тело 4)</text>
<rect x="78" y="534.75" width="12" height="12" rx="2" fill="var(--m-pu)" fill-opacity="0.82"/>
<text class="lg" x="96" y="544.75">1 — полиуретан 626, itype 8, ρ₀ = 626</text>
<rect x="78" y="554.75" width="12" height="12" rx="2" fill="var(--m-b4c)" fill-opacity="0.82"/>
<text class="lg" x="96" y="564.75">2, 3 — карбид бора B4C, itype 10, ρ₀ = 2510</text>
<rect x="78" y="574.75" width="12" height="12" rx="2" fill="var(--m-lif)" fill-opacity="0.82"/>
<text class="lg" x="96" y="584.75">4 — фторид лития LiF, itype 5, ρ₀ = 2638</text>
<text class="dm" x="78" y="623">Числа под осью — толщина тела, мм. Зазоры между телами: 0,2 / 0,8 / 0,2 мм. Удар вдоль z слева направо</text>
</svg>