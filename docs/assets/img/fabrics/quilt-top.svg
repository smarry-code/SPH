<text x="586.0" y="110.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >линия шва: посередине между нитями</text>
<text x="586.0" y="126.0" font-size="12" text-anchor="start" fill="#666666" font-weight="normal" >P−1 и P (нити считаются с 0)</text>
