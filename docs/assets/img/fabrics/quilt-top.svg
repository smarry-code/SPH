<text x="586.0" y="154.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >прокол: бусина нити, пересекающей</text>
<text x="586.0" y="170.0" font-size="12" text-anchor="start" fill="#666666" font-weight="normal" >линию шва (середина полуволны, z = c_z)</text>
