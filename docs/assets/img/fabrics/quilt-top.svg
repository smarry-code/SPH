<text x="586.0" y="200.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >пересечение линий шва: нити нет,</text>
<text x="586.0" y="216.0" font-size="12" text-anchor="start" fill="#666666" font-weight="normal" >прокола нет</text>
<rect x="540" y="232" width="36" height="22" fill="#f3f6fa" stroke="#cfd8dc"/><rect x="558" y="232" width="18" height="22" fill="#fdf5ec"/>
<text x="586.0" y="248.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >патч P×P нитей: только метка бусин;</text>
<text x="586.0" y="264.0" font-size="12" text-anchor="start" fill="#666666" font-weight="normal" >нити идут через стыки без разрыва</text>
<line x1="540.0" y1="288.0" x2="576.0" y2="288.0" stroke="#1f5fa8" stroke-width="2.4" />
<text x="586.0" y="292.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >основа (вдоль x)</text>
<line x1="540.0" y1="310.0" x2="576.0" y2="310.0" stroke="#d9731a" stroke-width="2.4" />
<text x="586.0" y="314.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >уток (вдоль y)</text>
<text x="540.0" y="350.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >Линия шва:  c + (t·P − ½ − (n−1)/2)·p,</text>
<text x="540.0" y="368.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >t = 1 … tile−1 (здесь 2 линии на ось)</text>
<text x="540.0" y="396.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >Патчи соединяют только стежки:</text>
<text x="540.0" y="412.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >в каждый прокол приходит стежок</text>
<text x="540.0" y="428.0" font-size="12" text-anchor="start" fill="#222222" font-weight="normal" >(схема стежков — на следующем рисунке).</text>
<text x="540.0" y="456.0" font-size="12" text-anchor="start" fill="#666666" font-weight="normal" >Проколов на линию: 9 (одна на нить),</text>
<text x="540.0" y="472.0" font-size="12" text-anchor="start" fill="#666666" font-weight="normal" >при --stitch-every=N — ⌈9/N⌉.</text>
</svg>
